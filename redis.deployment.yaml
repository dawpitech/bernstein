apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: default
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      restartPolicy: Always
      containers:
        - name: redis
          image: redis:5.0
          resources:
            limits:
              memory: "128M"
              cpu: "500m"
          ports:
            - containerPort: 6379
          envFrom:
            - configMapRef:
                name: redis-config
